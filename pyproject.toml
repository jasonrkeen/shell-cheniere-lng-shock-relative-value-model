[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shell-cheniere-lng-shock-relative-value-model"
version = "0.1.0"
description = "Scenario and Monte Carlo model of Shell versus Cheniere under global LNG supply disruption."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jason Keen"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "reportlab>=4.2",
  "yfinance>=0.2.54",
]

[tool.setuptools.packages.find]
include = ["src*"]

